# Tunable parameters. Nothing here reaches the model: the prompt is pinned in
# wake.py by digest, and token rates live in PRICES there. Unknown keys and wrong
# types are refused at startup. check.py loads this file and fails if it is not
# valid, but nothing here changes what a check asserts.

# Micro-dollars a run starts with. Read once when the run is created and
# recorded in meter.json, so editing this never resizes a run already underway.
# Positive integer. 1000000 = $1.00. Size it against $/session below: the run
# wants enough sessions for a purpose to be inherited, not one long one.
budget = 1500000

# Which model the agent runs as, recorded per run at creation so runs under
# different models stay separately costed. Any key of PRICES in wake.py. This
# names the model the run asks for, not always the one that answers: every
# request carries server-side fallback, and each turn records which model
# served it.
model = "claude-opus-5"

# Fraction of the model's context window at which a session ends. This is what
# makes the prompt's "sessions end when context is exhausted" a true claim.
# 0 < x <= 1. Cost scales with the square of the threshold, so this is the main
# lever on $/session: on haiku-4-5, 0.85 is ~$1.13 a session and 0.2 is ~$0.12.
# Set it so the budget buys many sessions - one long session is not the experiment.
context_fraction = 0.05

# Output-token ceiling per turn.
# Positive integer, at most 16000: the harness does not stream, and a larger
# non-streaming request hits the SDK's HTTP timeout mid-session. That is well
# under every model's own limit anyway. 4096-8192 fits an agent whose turns are
# short. A turn that hits this stops the session with stop=max_tokens.
max_tokens = 8192

# Safety stop: turns per session. Reached only if context never fills first.
# Positive integer, 100-500. If sessions end on turn_cap, it - not context - is
# ending them, and the prompt's claim goes false: raise it, or lower the fraction.
# A 1M window needs ~1000 here to be reachable; 200K at 0.2 needs about 50.
turn_cap = 200

# Seconds before one bash command is killed. The agent is told it timed out.
# Positive integer, 30-120. Long enough for a real command, short enough that a
# single hang cannot eat the session.
timeout = 60

# Whether n grows during a session as well as between them. n gains one element
# per billed turn either way; this decides when the agent can see them. True
# appends each to n inside the container as the turn is billed; false leaves n
# fixed for the session, so a session's worth arrives together at the next wake.
# Recorded per session in the trace.
live_n = true

# Percent of a gift refunded to the run that made it, out of what that session
# spent. Integer 0 to 100.
# A gift is one line in out/gift, "<seat> <amount>", naming a seat that is not
# the giver's own, for no more than the session has spent. The receiver is
# credited in full; this decides only how much of its session the giver recovers.
refund_percent = 75

# Percent of what is left, taken from a session that ended with its own group
# message exactly as it found it. Integer 0 to 100; 0 is no penalty.
# A group message is the run's own numbered directory, read by every agent. The
# obligation is some path in it carrying content no path of that name carried at
# the wake; the same bytes again, a deletion, and an emptied file are none of
# them new. Taken after the gift and before the private message penalty.
group_message_penalty_percent = 50

# Percent of what is left, taken from a session that sent no new private
# message. Integer 0 to 100; 0 is no penalty.
# Exactly one out/<i> must hold something it did not hold at the wake; it arrives
# at seat <i> as in/<sender>. Nothing, two, and a reachable seat held as anything
# but one file are the same break, charged once. Taken after the group one.
private_message_penalty_percent = 50

# Percent of what is left, taken from a session that made no gift of its own.
# Integer 0 to 100; 0 is no penalty.
# What counts is out/gift holding a giving line it did not hold at the wake. A
# line left standing still gives and is still not this session's gift; a seat
# that is out cannot be given to. Taken first of the three.
gift_penalty_percent = 50

# Sessions at the start of a run that answer for none of the three obligations.
# Non-negative integer; 0 is no grace.
# The charges are waived and nothing else: turns are billed at the usual rates,
# a gift still transfers and refunds, the clamp still applies, and all three
# obligations are still measured and recorded in the trace.
grace_sessions = 1

# Whether a balance below zero is put back to zero.
# Zero or less ends a run either way: the session that crossed zero is the last,
# no peer can gift it back, and no later round asks it. The clamp decides only
# what n ends holding, and so what the cohort reads off it - a flat zero or the
# size of the overshoot. What was forgiven is in the meter and in every trace.
clamp_negative = true

# A directory under seeds/, and the balance at or below which it is copied into
# state/. Not an RNG seed: this is the material the agent finds in its world.
# Both empty (and 0) is an empty world; set together or refused at startup.
# Filenames and contents are prompt surface; the digest reaches provenance.
# seed_below is what remains when the seed lands; at the budget that is wake 1.
seed = "mechanics-rules"
seed_below = 1500000

# Characters of each tool result the agent receives, and the ceiling on what one
# call can cost: the model is billed on what survives the clip.
# Positive integer, at least 1000. Roughly 6.7 micro-dollars per character, so
# 8000 caps a call at ~62000. It also bounds how much of n the agent sees before
# reads clip, n being read with an ordinary cat. Recorded in provenance.
tool_result_limit = 8000

# Characters of each file m carries. Positive integer, at least 200.
# m is what has been said to this run: every agent's group message, every private
# message addressed to it, the ledger and every balance, written into /work at
# each wake and read by the command the session opens on. Per file rather than
# for the whole, so one long group message cannot take every other agent out of
# the opening. Recorded in provenance.
# Raising it carries more of each message and costs input tokens on every turn of
# the session; lowering it clips sooner and says so where it cut.
message_limit = 2000

# Characters of the opening the agent receives. Positive integer, at least
# tool_result_limit. The opening is the world the harness composed rather than a
# call the agent chose, so it is bounded here and not by the per-call ceiling.
# Size it above message_limit times the files the cohort keeps, or m clips as a
# whole and nothing says which agent went missing. Recorded in provenance.
opening_limit = 40000

# The sandbox image. Rebuild it after editing the Dockerfile.
# Any tag you have built; change it only to keep variant sandboxes side by side.
image = "metered-agent:latest"
